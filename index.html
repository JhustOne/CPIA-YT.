<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPIA-YT | Desafío de dragones</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#164c54 0%,#0b2533 42%,#07121e 100%);font-family:system-ui,Arial,sans-serif;color:#fff2d3;display:grid;place-items:center;padding:20px}.wrap{max-width:650px;width:100%;border:1px solid #c99a4e77;background:#102b39ed;border-radius:24px;padding:clamp(18px,5vw,36px);box-shadow:0 25px 80px #0008}header{text-align:center}header small{letter-spacing:5px;color:#ffbe62;font-weight:800}h1{margin:12px 0;color:#ffd28b;font-size:clamp(27px,6vw,42px)}.dragon{font-size:56px;filter:drop-shadow(0 0 20px #ff853b)}p{color:#bcd5d1}.meta{display:flex;justify-content:space-between;margin:25px 0 10px;color:#ffe3ac;font-weight:700}.bar{height:9px;border-radius:20px;background:#31505b;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#41bba7,#f8a449);transition:width .3s}h2{font-size:23px;line-height:1.4;margin:25px 0}.answers{display:grid;gap:12px}.answer{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid #517480;background:#1b4050;color:#f9f0d8;border-radius:14px;padding:14px;cursor:pointer;font-size:16px}.answer:hover:not(:disabled){background:#285d6a}.answer.selected{border-color:#ffc26b;background:#405345}.answer.correct{border-color:#52d6a4;background:#164b43}.answer.wrong{border-color:#ff786e;background:#59333d}.letter{background:#10313d;border-radius:9px;min-width:35px;padding:8px;text-align:center;color:#ffd28b;font-weight:800}button:disabled{cursor:default}.main{width:100%;border:0;border-radius:14px;padding:15px;margin-top:20px;background:linear-gradient(90deg,#ef873b,#ffc36a);color:#1b2530;font-weight:900;font-size:16px;cursor:pointer}.main:disabled{opacity:.4}.feedback{margin-top:16px;padding:12px;border-radius:12px;background:#23434d}.hide{display:none}.foot{text-align:center;font-size:12px;margin-top:22px;color:#8aa8af}</style></head><body><main class="wrap"><header><small>CPIA-YT</small><div class="dragon">🐉🔥</div><h1>El desafío de los dragones</h1><p>20 preguntas • Una respuesta correcta • ¿Serás maestro de Berk?</p></header><section id="game"><div class="meta"><span id="counter"></span><span id="points"></span></div><div class="bar"><div class="fill" id="fill"></div></div><h2 id="question"></h2><div class="answers" id="answers"></div><div id="feedback" class="feedback hide"></div><button class="main" id="next" disabled>Comprobar respuesta</button></section><section id="results" class="hide" style="text-align:center"><h2>🏆 ¡Desafío completado!</h2><h1 id="resultScore"></h1><h2 id="rank"></h2><p id="summary"></p><button class="main" onclick="restart()">Volver a jugar</button></section><div class="foot">CPIA-YT · Trivia creada por fans · No oficial</div></main><script>const qs=[["¿Cómo se llama el dragón de Hipo?",["Tormenta","Chimuelo","Garfio","Albóndiga"],1],["¿Qué especie es Chimuelo?",["Nadder Mortífero","Furia Nocturna","Gronckle","Pesadilla Monstruosa"],1],["¿Dónde vive Hipo?",["Berk","Valhalla","Arendelle","Isla Calavera"],0],["¿Quién es el padre de Hipo?",["Bocón","Eret","Estoico el Vasto","Drago"],2],["¿Cómo se llama la madre de Hipo?",["Astrid","Valka","Brutilda","Heather"],1],["¿Quién es la compañera de Hipo?",["Astrid","Valka","Brutilda","Ruffnut"],0],["¿Qué dragón monta Astrid?",["Gronckle","Nadder Mortífero","Furia Nocturna","Zippleback"],1],["¿Cómo se llama el dragón de Astrid?",["Garfio","Colmillo","Tormenta","Albóndiga"],2],["¿Qué parte de la cola perdió Chimuelo?",["Una aleta caudal","Toda la cola","Las escamas","Dos espinas"],0],["¿Quién es el herrero de Berk?",["Patapez","Bocón","Patán","Eret"],1],["¿Qué dragón tiene dos cabezas?",["Gronckle","Zippleback Espantoso","Furia Nocturna","Nadder Mortífero"],1],["¿Quién monta a Albóndiga?",["Hipo","Patán","Patapez","Astrid"],2],["¿Cómo se llama el dragón de Patán?",["Garfio","Tormenta","Chimuelo","Albóndiga"],0],["¿Quién es el villano de la segunda película?",["Grimmel","Drago Manodura","Bocón","Eret"],1],["¿Qué dragón gigante aparece en la segunda película?",["Bestia Implacable","Nadder","Gronckle","Zippleback"],0],["¿Cómo se conoce a la dragona blanca de la tercera película?",["Furia Luminosa","Furia Nocturna","Tormenta","Reina Blanca"],0],["¿Quién persigue a Chimuelo en la tercera película?",["Drago","Grimmel","Estoico","Patapez"],1],["¿Cómo se llama el hogar secreto de los dragones?",["Berk","El Mundo Oculto","La Isla de Hielo","Valhalla"],1],["¿Quiénes son los gemelos amigos de Hipo?",["Patán y Patapez","Brutacio y Brutilda","Bocón y Eret","Hipo y Chimuelo"],1],["¿En qué se convierte Hipo al final de la segunda película?",["Herrero","Jefe de Berk","Cazador","Rey de los dragones"],1]];let idx=0,score=0,chosen=-1,checked=false;const el=id=>document.getElementById(id);function draw(){const q=qs[idx];el('counter').textContent='Pregunta '+(idx+1)+' de '+qs.length;el('points').textContent='⭐ '+score+' puntos';el('fill').style.width=(idx/qs.length*100)+'%';el('question').textContent=q[0];el('answers').innerHTML='';q[1].forEach((a,i)=>{const b=document.createElement('button');b.className='answer';const l=document.createElement('span');l.className='letter';l.textContent='ABCD'[i];const t=document.createElement('span');t.textContent=a;b.append(l,t);b.onclick=()=>{if(checked)return;chosen=i;document.querySelectorAll('.answer').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');el('next').disabled=false};el('answers').append(b)});el('feedback').classList.add('hide');el('next').textContent='Comprobar respuesta';el('next').disabled=true}el('next').onclick=()=>{if(!checked){if(chosen<0)return;checked=true;if(chosen===qs[idx][2])score++;document.querySelectorAll('.answer').forEach((b,i)=>{b.disabled=true;if(i===qs[idx][2])b.classList.add('correct');else if(i===chosen)b.classList.add('wrong')});el('feedback').textContent=chosen===qs[idx][2]?'✅ ¡Respuesta correcta!':'❌ La respuesta correcta es: '+qs[idx][1][qs[idx][2]];el('feedback').classList.remove('hide');el('next').textContent=idx===qs.length-1?'Ver resultados':'Siguiente pregunta';el('points').textContent='⭐ '+score+' puntos'}else{idx++;chosen=-1;checked=false;if(idx===qs.length){el('game').classList.add('hide');el('results').classList.remove('hide');el('resultScore').textContent=score+' / '+qs.length;el('rank').textContent=score===20?'¡Leyenda de los dragones!':score>=16?'¡Maestro de dragones!':score>=11?'¡Jinete de dragones!':score>=6?'¡Aprendiz de Berk!':'¡Entrenador principiante!';el('summary').textContent='Acertaste el '+(score*5)+'% de las preguntas.'}else draw()}};function restart(){idx=0;score=0;chosen=-1;checked=false;el('results').classList.add('hide');el('game').classList.remove('hide');draw()}draw();</script></body></html>
